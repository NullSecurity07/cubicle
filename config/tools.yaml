# Tool → default approval mode. Overridable per role (charter `approval_overrides`) and by the owner
# (`Memory/owner_preferences.md` `approvals:` block). A `never` set here cannot be loosened by anyone.
#
# mode: auto | propose | ask | never
# outbound: true  → the harness generates an idempotency key <job>:<attempt>:<step>, records it before returning,
#                   and skips the call on resume. `propose` stores the call in a proposal for the daemon to execute.
# proposal_kind: which `00 Inbox/` kind a propose/ask creates.
tools:
  vault.read:            { mode: auto }
  vault.search:          { mode: auto }
  vault.list:            { mode: auto }
  vault.write:           { mode: auto, owner_owned_mode: propose, proposal_kind: file_change }
  vault.append:          { mode: auto, owner_owned_mode: propose, proposal_kind: file_change }
  adr.create:            { mode: auto }
  shell.run:             { mode: auto, roles: [dev_manager, backend_engineer, frontend_engineer, fullstack_engineer, platform_engineer, sre, qa_lead, qa_automation, qa_performance, qa_security, qa_release, research_engineer, data_scientist, ciso, engineer, engineer_2, devops] }
  ci.run:                { mode: auto, roles: [dev_manager, backend_engineer, frontend_engineer, fullstack_engineer, platform_engineer, sre, qa_lead, qa_automation, qa_performance, qa_security, qa_release] }
  git.log:               { mode: auto }
  git.diff:              { mode: auto }
  git.commit:            { mode: auto }
  git.revert:            { mode: auto }
  http.fetch:            { mode: auto }
  browser.open:          { mode: auto }
  browser.goto:          { mode: auto }
  browser.click:         { mode: auto }
  browser.type:          { mode: auto }
  browser.extract:       { mode: auto }
  browser.screenshot:    { mode: auto }
  browser.submit:        { mode: ask, outbound: true, proposal_kind: outbound_batch }
  browser.close:         { mode: auto }
  email.send:            { mode: ask, outbound: true, proposal_kind: outbound_batch }
  email.inbox:           { mode: auto }
  deploy.site:           { mode: propose, outbound: true, proposal_kind: spend, first_time_only: true }
  stripe.payment_link:   { mode: propose, outbound: true, proposal_kind: spend }
  analytics.pull:        { mode: auto }
  social.post:           { mode: ask, outbound: true, proposal_kind: outbound_batch }
  colleague.message:     { mode: auto }
  meeting.open:          { mode: auto }
  skills.save:           { mode: auto }
  skills.load:           { mode: auto }
  skills.search:         { mode: auto }
  scheduler.request:     { mode: auto }
  research.start:        { mode: auto }
  sources.cite:          { mode: auto }
  discovery.inputs:      { mode: auto }
  idea.card:             { mode: auto }
  proposal.create:       { mode: auto }
  ledger.record:         { mode: auto }
  finish:                { mode: auto }
  mock.outbound:         { mode: auto, outbound: true, proposal_kind: outbound_batch }

# Egress allow-list for `shell.run` in `network: allowlist` mode (proxy-enforced, advisory).
sandbox_allowlist:
  - registry.npmjs.org
  - github.com
  - "*.githubusercontent.com"
  - cdn.jsdelivr.net

http_fetch:
  max_bytes: 400000
  timeout_ms: 20000
  per_host_interval_ms: 1000
  user_agent: "cubicle-bot/0.1 (+local research agent; respects robots.txt)"
