# Review gates per job type (spec §3). Each job type maps to an ordered list of gate job types that must pass
# before the job counts as accepted; `criteria` under the matching key is shown to the author and the reviewer
# as "What good looks like".
#
# A gate is named by the office that runs it (`office:<office>.<verb>`) or by the room whose lead runs it
# (`team:<team>.<verb>`); `requester.review` goes back to whoever asked. `qa.review`, `coo.verify` and
# `security.review` are the pre-office names, kept so a job queued before the rename still finds its table entry.
#
# A review job is created at the `medium` tier: reviewers are leads and office holders, and running every gate
# at their charter's tier spent eleven of a ~60-a-day free strong allowance on reviews in one live minute. The
# optional `model_tier:` map at the bottom of this file names a different tier for one gate; the reviewer's own
# charter is still the ceiling, so a cheap-tier charter reviews at cheap whatever is written here.
gates:
  engineer.ship: [team:qa.review, office:operations.verify]
  research: [research.review, requester.review]
  research.review: []
  research.measure: [requester.review]
  intelligence: []
  growth.outreach: [office:operations.verify]
  growth.post: [office:operations.verify]
  growth.seo: [office:operations.verify]
  custom: [office:operations.verify]
  company.plan: []
  division.plan: []
  board.premortem: []
  team.plan: []
  critic.premortem: []
  team:qa.review: []
  office:operations.verify: []
  office:security.review: []
  requester.review: []
  cto.plan: []
  cto.compress_charters: []
  ceo.heartbeat: []
  colleague.answer: []
  incident: [office:operations.verify]
  discovery: [requester.review]
  board.session: []
  finance.estimate: []
  qa.review: []
  coo.verify: []
  security.review: []
  finance.runway: []
  # SP5: the two trust gates every outbound call owes. `office:security.review` is already listed above as a
  # risk-chain gate; the same entry serves both, because it is the same review done against a call.
  office:compliance.review: []
  # SP5: a coffee break is not work and owes nothing; the entry exists so it does not inherit `custom`'s chain.
  pantry.chat: []

criteria:
  engineer.ship: "The change builds and runs; Site/ has no broken links; tests or a smoke check exist; the job's Done when holds."
  research: "Sources linked; options compared against the free-tier constraint; one clear recommendation; a next step the requester can schedule."
  growth.outreach: "Every recipient is a real, sourced prospect — a Customers/<slug>.md note with `source:` (the URL it was found on, or `inbox`); every message is approved before it leaves; the audience and the offer are named; results are measurable."
  growth.post: "On-brand, no banned tactics, one call to action."
  growth.seo: "Pages have titles, descriptions and internal links; nothing fabricated."
  custom: "The job's Done when holds and the evidence is in the Result."
  division.plan: "At most 4 jobs, each finishable in one sitting with a Done when; the plan section names them; each job goes to the room that owns the work."
  team.plan: "At most 4 jobs, each finishable in one sitting with a Done when; the plan section names them."
  board.premortem: "Three advisors, one joint verdict: concrete failure modes with a fix each; pass or return, never delay."
  critic.premortem: "Concrete failure modes with a fix each; pass or return, never delay."
  team:qa.review: "Findings cite files or output; the CI record in Workspace/<stream>/.cubicle-ci/ is green and newer than the change; a ship that changed the architecture (a new dependency, a new service, a new data store, a changed boundary) has an ADR in Docs/adr/ — return it if it does not; verdict pass or return."
  office:security.review: "Say what data, credentials and permissions the change touches, and judge each: secrets never in the diff, input validated at the boundary, authorisation checked on the server, nothing sensitive logged. A finding cites the file and the line. Verdict pass or return."
  office:operations.verify: "Evidence-based; exactly one lesson."
  company.plan: "One objective section per division."
  colleague.answer: "The question is answered with colleague.message(re:<id>)"
  research.review: "Evidence sufficiency: enough evidence, from more than one independent source, to support the decision at the required confidence. Bias: the method could have disproved the favoured answer. Contradictory evidence is named, not buried. Every finding states its confidence, assumptions and limitations. Verdict pass or return."
  research.measure: "Prediction and outcome are both stated with dates; the report's `## Prediction vs reality` section is appended; Research/index.md carries the outcome."
  intelligence: "Dated observations with a source link each; meaningful change separated from noise; every meaningful change is either an idea card or an alert; nothing invented."
  incident: "The stream is serving again and the rollback or fix is named; Docs/postmortems/<date>-<slug>.md exists with a timeline, an impact in hours, a root cause that is a design or a missing check rather than a person, and at least one corrective action with an owner. No names anywhere in the postmortem."
  # FR-4/FR-5: the first live brief was beautiful and false, and was then returned for a reason that was itself
  # false ("PIVOT REQUIRED is two words"). So the reviewer is told to read, not to skim, and told what a
  # verdict looks like.
  discovery: "The founder brief has all eight sections and names the files it was read from; every claim about what already exists cites one of them; each candidate idea is its own Ideas/<slug>.md card with evidence, never a list inside the brief; what we do not know is not empty. Open every file the brief cites with vault.read and confirm each claim against it before you pass: a claim the file does not carry is a return that quotes the file and the false sentence. Brand/name.md with an empty name means the company has no name; an interview with no ## Answer means nobody answered it; the material establishing nothing is written as 'unstated', not filled in. The ## Pressure test ends on the verdict — STRONG, WEAK or PIVOT REQUIRED — then the reasons; PIVOT REQUIRED is two words and is a valid verdict, never a reason to return."
  finance.estimate: "One rough order of magnitude in words — people, weeks, out-of-pocket cost — with the assumption behind it; value and effort set on the card with one line each saying why. No ledger entry, no revenue projection dressed as a fact."
  board.session: "Three advisors, one joint verdict on one idea: concrete failure modes with a fix each; pass or return, never delay. The board advises; the owner decides."
  # Pre-office names. A job queued before the rename still reads its criteria from here.
  qa.review: "Findings cite files or output; the CI record in Workspace/<stream>/.cubicle-ci/ is green and newer than the change; a ship that changed the architecture (a new dependency, a new service, a new data store, a changed boundary) has an ADR in Docs/adr/ — return it if it does not; verdict pass or return."
  security.review: "Say what data, credentials and permissions the change touches, and judge each: secrets never in the diff, input validated at the boundary, authorisation checked on the server, nothing sensitive logged. A finding cites the file and the line. Verdict pass or return."
  coo.verify: "Evidence-based; exactly one lesson."
  finance.runway: "Five lines at most, each one about a number already in Ledger/runway.md — cash, burn, runway, what a paid tier would have cost, or a division near its model quota. Say what you would do about it. Never restate a figure as if you calculated it, never invent one, and never propose a spend the owner has not been asked for."
  # S-3: the fiction the first two gates missed. Sales invented three companies with made-up addresses in the
  # second live run and the CSO tried to mail them; `email.send` now refuses an unsourced recipient in code, and
  # this criterion is the same rule stated for the reviewer, so a return says why rather than only what.
  office:compliance.review: "Judge the exact text and arguments that would leave the company, not a summary. Six questions: is every recipient real and sourced — each address backed by a Customers/<slug>.md note carrying `source:`, the URL it was found on or `inbox` for someone who wrote to us, never an address a role invented (Roles/cmo.md: 'Research before outreach: one Customers/ note per lead with the evidence you found'); is every claim true and supportable; did the recipient consent to hear from us; does it obey the constitution's banned channels and banned tactics; is there a way out (an unsubscribe, a refund, a rollback); and would the owner be content to see this in public with their name on it. A finding names the line to change. Verdict pass or return."
  pantry.chat: "Two people, six turns, one closing IDEA line or IDEA: none. Nothing is decided here and nothing leaves the room."

# Per-gate tier, when `medium` is the wrong default for one review. Every key must also appear under `gates:`
# above (that map is what defines the job types this file knows). Nothing needs an override today.
model_tier: {}
