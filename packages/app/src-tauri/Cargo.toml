[package]
name = "cubicle-tray"
version = "0.1.0"
edition = "2021"
description = "CUBICLE tray shell: start/stop the daemon, open the office, open the vault, checkpoint on sleep"
publish = false

[build-dependencies]
tauri-build = { version = "2", default-features = false }

[dependencies]
tauri = { version = "2.11", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["signal", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
libc = "0.2"
futures-util = { version = "0.3", default-features = false }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
