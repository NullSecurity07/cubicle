<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CUBICLE — the office</title>
    <link rel="icon" href="data:," />
    <style>
      html { background: #0e1014; color-scheme: dark; }
      html[data-theme="light"] { background: #f4f5f8; color-scheme: light; }
      body { margin: 0; height: 100%; overflow: hidden; }
      #game { position: absolute; inset: 0; }
      [hidden] { display: none !important; }
      #layer, #rail, #minimap-chrome, #toast, #coach { visibility: hidden; }  /* until the stylesheet is in */
    </style>
  </head>
  <body>
    <div id="game" aria-hidden="true"></div>
    <header id="bar" class="glass">
      <div class="brand"><span class="mark" aria-hidden="true"></span><strong id="brand-name">Your company</strong><span id="brand-tagline">No name yet. Tell the CEO your idea.</span></div>
      <nav aria-label="Company">
        <span class="status" id="conn"><i class="dot"></i><span id="conn-text">connecting</span></span>
        <button class="pill attn" id="pending" data-open="postoffice" data-count="0" title="proposals waiting for you" hidden>0 to approve</button>
        <button class="txt" data-open="newsstand">Brief</button>
        <button class="txt" data-open="whiteboard">Plan</button>
        <button class="txt" data-open="noticeboard">Queue</button>
        <button class="txt" data-open="org">Org</button>
        <button class="txt primary" data-open="cabin">Talk to the CEO</button>
      </nav>
    </header>
    <nav id="rail" class="glass" aria-label="Floors"></nav>
    <div id="coach" class="footnote glass" hidden></div>
    <div id="scrim" hidden></div>
    <div id="layer" hidden>
      <section id="panel" tabindex="-1" aria-labelledby="panel-title">
        <header class="phead">
          <button class="icon" id="panel-back" aria-label="Back" hidden></button>
          <div class="titles"><nav class="trail" id="panel-trail" aria-label="Breadcrumb"></nav><h2 id="panel-title"></h2><p class="sub" id="panel-sub" hidden></p></div>
          <a id="panel-link" class="btn" hidden>Open in Obsidian</a>
          <button id="panel-copy" class="btn" hidden>Copy</button>
          <button class="icon" id="panel-close" aria-label="Close"></button>
        </header>
        <div class="body" id="panel-body"></div>
        <button class="jump" id="panel-jump" hidden>Jump to latest</button>
        <form id="chat" hidden><input id="chat-text" type="text" placeholder="Message your CEO" autocomplete="off" aria-label="Message your CEO" /><button type="submit" class="btn primary">Send</button></form>
      </section>
    </div>
    <!-- `data-mode` is written by ui/time.ts: in live mode the date, the transport and the speed are not controls the
         owner has any use for, so they are not on the screen. The sun/moon and the clock belong to both modes. -->
    <div id="time" class="glass" data-mode="live">
      <div class="segmented" role="tablist" aria-label="Live or replay"><button id="live" class="seg" role="tab" aria-selected="true"><i class="dot ok"></i>Live</button><button id="replay-load" class="seg" role="tab" aria-selected="false">Replay</button></div>
      <span class="datefield replay-only"><span id="replay-date-icon" class="pi" aria-hidden="true"></span><span id="replay-date-text">—</span><input type="date" id="replay-date" aria-label="Replay date" /></span>
      <span id="sunmoon"></span>
      <button id="playpause" class="icon replay-only" aria-label="Pause the replay (Space)"></button>
      <input type="range" id="scrub" class="replay-only" min="0" max="1000" value="0" disabled aria-label="Replay position" />
      <!-- A segmented control, filled by ui/time.ts: a native <select> was the one browser-drawn widget among a bar
           of custom ones, and it brought the platform's own arrow with it (visual QA M3). -->
      <div id="speed" class="segmented replay-only" role="tablist" aria-label="Replay speed"></div>
      <span id="clock" class="footnote"></span>
      <span id="replay-hint" class="caption dim replay-only">Space plays · arrows step</span>
    </div>
    <div id="minimap-chrome" hidden></div>
    <div id="toast" hidden></div>
    <div id="announcer" aria-live="polite" class="sr-only"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
