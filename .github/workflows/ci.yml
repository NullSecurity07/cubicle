# Minimal CI: typecheck and unit tests for the TypeScript packages, plus the Rust tray's own tests.
# Suites that need a live service (Ollama, Docker, a display) skip themselves when it is absent — see the
# notes beside each job. Acceptance tests (`pnpm test:acceptance`) spawn whole daemons and are not run here.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: typecheck + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Every package but the Rust tray. harness/live-local skips without CUBICLE_LIVE=1; the tools shell
      # tests take the local (non-Docker) path when Docker is absent.
      - run: pnpm -r --filter '!@cubicle/app' test
        env:
          CI: "1"

  tray:
    name: rust tray (cargo test + clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: packages/app/src-tauri
    steps:
      - uses: actions/checkout@v4
      # Tauri 2 on Ubuntu 24.04: webkit2gtk 4.1, the Ayatana appindicator (libappindicator3-dev is gone from 24.04), rsvg.
      - name: system libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/app/src-tauri
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings
